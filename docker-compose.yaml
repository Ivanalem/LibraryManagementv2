services:
  mysql:
    image: mysql:8.0
    container_name: mysql_base

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: Alem4ikivan4ik
      MYSQL_DATABASE: petprojectschema

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

    command: --max_connections=100

  app:
    build: .
    container_name: library-app

    ports:
      - "8080:8080"

    depends_on:
      - mysql

volumes:
  mysql_data: